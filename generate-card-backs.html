<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生成卡面图片</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: #2a2a2a; border-radius: 8px; padding: 15px; text-align: center; }
    .card img { width: 100%; border-radius: 6px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .card p { margin: 0; font-size: 12px; color: #aaa; }
    .locked { opacity: 0.5; }
    .unlock-info { color: #C9A227; font-size: 11px; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>卡面风格预览</h1>
  <div class="grid">
    <!-- 国风系列 -->
    <div class="card">
      <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20traditional%20Chinese%20playing%20card%20back%20design%20with%20red%20and%20gold%20colors%2C%20featuring%20cloud%20patterns%2C%20geometric%20borders%2C%20and%20a%20central%20medallion%20with%20Chinese%20knot%20motif%2C%20elegant%20and%20symmetrical%2C%20high%20quality%20illustration&image_size=portrait_4_3" alt="国风·锦绣">
      <h3>国风·锦绣（默认）</h3>
      <p>经典红金配色，祥云纹样</p>
      <p class="unlock-info">初始解锁</p>
    </div>
    <div class="card">
      <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20traditional%20Chinese%20playing%20card%20back%20design%20with%20deep%20blue%20and%20silver%20colors%2C%20featuring%20dragon%20scales%20pattern%2C%20wave%20motifs%2C%20and%20a%20central%20pearl%20design%2C%20majestic%20and%20powerful%2C%20high%20quality%20illustration&image_size=portrait_4_3" alt="国风·龙吟">
      <h3>国风·龙吟</h3>
      <p>深蓝银白，龙鳞水波纹</p>
      <p class="unlock-info">累计得分 500 分解锁</p>
    </div>
    <div class="card">
      <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20traditional%20Chinese%20playing%20card%20back%20design%20with%20jade%20green%20and%20gold%20colors%2C%20featuring%20bamboo%20and%20plum%20blossom%20patterns%2C%20minimalist%20and%20elegant%2C%20scholarly%20aesthetic%2C%20high%20quality%20illustration&image_size=portrait_4_3" alt="国风·竹韵">
      <h3>国风·竹韵</h3>
      <p>翠绿鎏金，梅兰竹菊</p>
      <p class="unlock-info">累计得分 1500 分解锁</p>
    </div>
    <!-- 和风系列 -->
    <div class="card">
      <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20traditional%20Japanese%20playing%20card%20back%20design%20with%20sakura%20pink%20and%20white%20colors%2C%20featuring%20cherry%20blossom%20petals%2C%20delicate%20branch%20patterns%2C%20and%20a%20central%20mon%20crest%2C%20soft%20and%20elegant%2C%20high%20quality%20illustration&image_size=portrait_4_3" alt="和风·樱华">
      <h3>和风·樱华（默认）</h3>
      <p>樱花粉白，飘落花瓣</p>
      <p class="unlock-info">初始解锁</p>
    </div>
    <div class="card">
      <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20traditional%20Japanese%20playing%20card%20back%20design%20with%20indigo%20blue%20and%20white%20colors%2C%20featuring%20wave%20patterns%20inspired%20by%20Hokusai%2C%20seigaiha%20motifs%2C%20and%20a%20central%20compass%20design%2C%20dynamic%20and%20bold%2C%20high%20quality%20illustration&image_size=portrait_4_3" alt="和风·海潮">
      <h3>和风·海潮</h3>
      <p>靛蓝海浪，浮世绘风格</p>
      <p class="unlock-info">累计得分 500 分解锁</p>
    </div>
    <div class="card">
      <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=A%20traditional%20Japanese%20playing%20card%20back%20design%20with%20crimson%20red%20and%20black%20colors%2C%20featuring%20samurai%20armor%20patterns%2C%20family%20crest%20motifs%2C%20and%20a%20central%20katana%20crossguard%20design%2C%20bold%20and%20powerful%2C%20high%20quality%20illustration&image_size=portrait_4_3" alt="和风·武士">
      <h3>和风·武士</h3>
      <p>红黑武士，家纹铠甲</p>
      <p class="unlock-info">累计得分 1500 分解锁</p>
    </div>
  </div>
</body>
</html>
